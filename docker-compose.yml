version: '3.8'

services:
  api:
    build: .
    container_name: rag_api_service
    ports:
      - "8000:8000"
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
      - CHROMA_PERSIST_DIR=/app/data/chroma
      - BM25_PERSIST_PATH=/app/data/bm25.pkl
    volumes:
      - ./data:/app/data
    command: uvicorn src.api.main:app --host 0.0.0.0 --port 8000

  ui:
    build: .
    container_name: rag_streamlit_ui
    ports:
      - "8501:8501"
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
      - CHROMA_PERSIST_DIR=/app/data/chroma
      - BM25_PERSIST_PATH=/app/data/bm25.pkl
    volumes:
      - ./data:/app/data
    command: streamlit run ui/streamlit_app.py --server.port=8501 --server.address=0.0.0.0
    depends_on:
      - api
